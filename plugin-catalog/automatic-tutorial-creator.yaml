name: automatic-tutorial-creator
title: "Automatic Tutorial Creator"
repo: https://github.com/flabanabba8/automatic-tutorial-creator
sha: c32ad2e21bf9da014dad6eb79c4d764cc89166e9
version: "0.3.3"
description: "Record a selected X11 window, mark demonstration steps, and export a checked video under 90 seconds. Disclosure: Records one window you select on a Linux X11 display with FFmpeg and cuts videos locally. Narration defaults to Gemini 3.8 Flash TTS through your own Google Cloud login (text goes to Google, with a spending guard), or a local speech server or host speech tool you choose. Computer-use steps only go through Hermes approvals. A recording runs in the background until you stop it."
maintainer: flabanabba8
tier: community
category: desktop
requires_hermes: ">=0.22.0"
docs_url: https://github.com/flabanabba8/automatic-tutorial-creator/blob/c32ad2e21bf9da014dad6eb79c4d764cc89166e9/README.md
image: https://raw.githubusercontent.com/flabanabba8/automatic-tutorial-creator/c32ad2e21bf9da014dad6eb79c4d764cc89166e9/assets/thumbnail.jpg
platforms: [linux]
capabilities:
  provides_tools:
    - capture_sources
    - capture_start
    - capture_status
    - capture_mark
    - capture_stop
    - capture_export
    - tutorial_timeline
    - tutorial_narrate
    - tutorial_step
    - tutorial_frame
  provides_hooks: []
  provides_middleware: []
  requires_env: []
