platforms: [linux]
capabilities:
  provides_tools:
    - localize_inspect
    - localize_get
    - localize_translate
    - localize_validate
    - localize_export
    - localize_list_drafts
  provides_hooks: []
  provides_middleware: []
  requires_env: []
