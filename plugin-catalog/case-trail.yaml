name: case-trail
title: Case Trail
repo: https://github.com/flabanabba8/case-trail
sha: e1b9a0de5a6f8024954aab40ed73f2f56f04cc2f
version: 0.4.4
description: "Trace case-history and treatment research to actual opinion passages; analyze supplied sources without a required repository. Disclosure — Sends case search queries and Justia page URLs through the web search/extract provider you configured in Hermes, and can fetch one public OpenJurist case page you select after a robots.txt check (OpenJurist sees the URL and your IP). Reads local opinion files at paths given in chat, refusing kernel and device files, the Hermes home and key stores; the plugin setting opinion_folders can limit it to folders you list. Stores fetched text, review receipts and rendered pages privately in its plugin data folder. Novelty research tool, not legal advice; unaffiliated with Justia or OpenJurist."
maintainer: flabanabba8
tier: community
category: web
requires_hermes: ">=0.22.3"
